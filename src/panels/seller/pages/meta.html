<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Invoice Share Demo</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  margin:0;
}
.container{
  width:800px;
  margin:30px auto;
  background:#fff;
  padding:25px;
  border-radius:6px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.btn{
  padding:8px 14px;
  border:none;
  border-radius:4px;
  cursor:pointer;
}
.download{ background:#0d6efd; color:#fff; }
.share{ background:#25D366; color:#fff; margin-left:8px; }

.invoice-title{text-align:center;margin-top:20px;}
.invoice-info{
  display:flex;
  justify-content:space-between;
  margin-top:20px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}
table th, table td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}
.total{
  text-align:right;
  font-size:18px;
  margin-top:15px;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.5);
}
.modal-content{
  background:#fff;
  width:360px;
  margin:120px auto;
  padding:20px;
  border-radius:6px;
  text-align:center;
}
.modal-btn{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:4px;
  cursor:pointer;
}
.whatsapp{ background:#25D366; color:#fff; }
.disabled{ background:#ddd; cursor:not-allowed; }
.close{ background:#6c757d; color:#fff; }

input, textarea{
  width:100%;
  padding:8px;
  margin-top:6px;
  margin-bottom:10px;
}
textarea{ resize:none; }
.error{
  color:red;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <h2>AGROBRIDGE</h2>
    <div>
      <button class="btn download">Download PDF</button>
      <button class="btn share" onclick="openShareModal()">Share</button>
    </div>
  </div>

  <div class="invoice-title">
    <h3>TAX INVOICE</h3>
  </div>

  <div class="invoice-info">
    <div>
      <p><b>Invoice No:</b> INV-8AAAE03B</p>
      <p><b>Date:</b> 20/01/2026</p>
    </div>
    <div>
      <p><b>Customer:</b> Vijay Tambade</p>
      <p><b>WhatsApp:</b> 9876543210</p>
    </div>
  </div>

  <table>
    <tr>
      <th>Sr</th>
      <th>Item</th>
      <th>Qty</th>
      <th>Rate</th>
      <th>Amount</th>
    </tr>
    <tr>
      <td>1</td>
      <td>Moyashi 500g</td>
      <td>1</td>
      <td>₹400</td>
      <td>₹400</td>
    </tr>
    <tr>
      <td>2</td>
      <td>Moyashi 1kg</td>
      <td>1</td>
      <td>₹600</td>
      <td>₹600</td>
    </tr>
  </table>

  <div class="total">
    <b>Total: ₹1100</b>
  </div>
</div>

<!-- SHARE MODAL -->
<div class="modal" id="shareModal">
  <div class="modal-content">
    <h3>Share Invoice</h3>
    <button class="modal-btn whatsapp" onclick="openWhatsappModal()">WhatsApp</button>
    <button class="modal-btn disabled">SMS (Coming Soon)</button>
    <button class="modal-btn disabled">Email (Coming Soon)</button>
    <button class="modal-btn close" onclick="closeShareModal()">Close</button>
  </div>
</div>

<!-- WHATSAPP MODAL -->
<div class="modal" id="whatsappModal">
  <div class="modal-content">
    <h3>Send via WhatsApp</h3>

    <label><b>Send To (WhatsApp Number)</b></label>
    <input type="text" id="sendToNumber" placeholder="Enter 10 digit mobile number">

    <label><b>Message</b></label>
    <textarea id="messageBox" rows="6"></textarea>

    <div class="error" id="errorMsg"></div>

    <button class="modal-btn whatsapp" onclick="sendWhatsapp()">Send WhatsApp</button>
    <button class="modal-btn close" onclick="closeWhatsappModal()">Cancel</button>
  </div>
</div>

<script>
// ================= INVOICE DATA =================
const invoiceWhatsappNumber = "919876543210";

const defaultMessage = `Hello 👋
Your Invoice is Ready

Invoice No: INV-8AAAE03B
Customer: Vijay Tambade
Total Amount: ₹1100

Download Invoice:
https://demo-agrobridge.com/invoice/INV-8AAAE03B.pdf

Thank you for your business!`;
// ===============================================

function openShareModal(){
  document.getElementById("shareModal").style.display = "block";
}

function closeShareModal(){
  document.getElementById("shareModal").style.display = "none";
}

function openWhatsappModal(){
  closeShareModal();
  document.getElementById("whatsappModal").style.display = "block";

  if(invoiceWhatsappNumber){
    document.getElementById("sendToNumber").value =
      invoiceWhatsappNumber.replace("91","");
  }

  document.getElementById("messageBox").value = defaultMessage;
}

function closeWhatsappModal(){
  document.getElementById("whatsappModal").style.display = "none";
  document.getElementById("errorMsg").innerText = "";
}

function sendWhatsapp(){
  const number = document.getElementById("sendToNumber").value.trim();
  const message = document.getElementById("messageBox").value.trim();

  if(number.length !== 10 || isNaN(number)){
    document.getElementById("errorMsg").innerText =
      "Please enter valid 10 digit WhatsApp number";
    return;
  }

  if(message === ""){
    document.getElementById("errorMsg").innerText =
      "Message cannot be empty";
    return;
  }

  const whatsappNumber = "91" + number;
  const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;

  window.open(url, "_blank");
}
</script>

</body>
</html>
