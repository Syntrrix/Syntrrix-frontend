services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_BASE_URL=https://api.app.syntrrix.com/api/
    container_name: agrobridge_frontend
    restart: always
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_BASE_URL=https://api.app.syntrrix.com/api/
